
<!DOCTYPE html>
<html lang="de" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Deals Marketer - Fullstack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'SF Pro Display';
            src: url('https://fonts.cdnfonts.com/s/15011/SFProDisplay-Bold.woff') format('woff');
        }
        @font-face {
            font-family: 'SF Pro Text';
            src: url('https://fonts.cdnfonts.com/s/15011/SFProText-Regular.woff') format('woff');
        }
        body {
            font-family: 'SF Pro Text', 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3, h4 {
            font-family: 'SF Pro Display', sans-serif;
        }
        .text-accent { color: #ff3d00; }
        .bg-accent { background-color: #ff3d00; }
        .border-accent { border-color: #ff3d00; }
        
        .grid-pattern {
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 80px 80px;
        }

        @keyframes scroll-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-scroll {
            animation: scroll-left 30s linear infinite;
        }
        
        @keyframes slide-up-fade {
            0%, 20% { transform: translateY(100%); opacity: 0; }
            25%, 45% { transform: translateY(0); opacity: 1; }
            50%, 70% { transform: translateY(-100%); opacity: 0; }
            75%, 100% { transform: translateY(-100%); opacity: 0; }
        }
        .animate-word {
            display: inline-block;
            animation: slide-up-fade 6s infinite;
        }

        /* Sound Wave Animation - Refined & Narrower */
        @keyframes soundWave {
            0%, 100% { height: 4px; }
            50% { height: 16px; }
        }
        .sound-bar {
            width: 1.5px;
            background-color: white;
            border-radius: 1px;
            animation: soundWave 1.2s ease-in-out infinite;
        }
        .sound-bar:nth-child(2) { animation-delay: 0.2s; }
        .sound-bar:nth-child(3) { animation-delay: 0.4s; }

        /* Premium Button Style */
        .btn-premium {
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            background-color: #ff3d00;
            border-radius: 1.5rem;
            padding: 0.6rem 2rem 0.6rem 0.6rem;
            color: white;
            font-weight: 700;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px -5px rgba(255, 61, 0, 0.3);
        }

        .btn-premium .icon-circle {
            background-color: #000000;
            width: 2.75rem;
            height: 2.75rem;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1.25rem;
            transition: transform 0.3s ease;
        }

        .btn-premium::after {
            content: "";
            position: absolute;
            top: 0;
            left: -150%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.25),
                transparent
            );
            transform: skewX(-25deg);
            animation: flow 4s infinite linear;
        }

        @keyframes flow {
            0% { left: -150%; }
            30% { left: 150%; }
            100% { left: 150%; }
        }

        /* Glass Play Button */
        .glass-play-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s ease-out, box-shadow 0.3s ease;
        }
        
        .glass-play-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, #ff3d00 0%, transparent 70%);
            opacity: 0.15;
            transition: opacity 0.3s ease;
        }
        
        .glass-play-btn:hover::before {
            opacity: 0.4;
        }
    </style>
<script type="importmap">
{

    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
